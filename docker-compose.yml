version: "3.9"

services:
  # 服务端
  webserver:
    build: .
    ports:
      - "3000:3000" # HTTP 服务端口
      - "3001:3001" # WebSocket 服务端口
    depends_on: # 依赖于db数据库，数据库启动之后才运行服务
      - db
    environment: # 环境变量,需要在koa代码中连接数据库使用
      - MONGO_URI=mongodb://db:27017/koaData
    container_name: webserver # 指定容器名
  # 数据库
  db:
    image: mongo:latest
    volumes:
      # - ./data/db:/data/db # 本地存储路径
      - db-data:/data/db # 使用 Docker 管理的卷 db-data
    ports:
      - "27017:27017"
    container_name: db # 指定容器名
  # 前端
  web:
    build:
      context: ../vue3-koa2-web # 假设前端代码位于 web 目录下
      dockerfile: Dockerfile # 假设该目录下有一个 Dockerfile
    ports:
      - "8080:80" # 将容器的 80 端口映射到宿主机的 80 端口
    container_name: web # 指定容器名

volumes:
  db-data: # 显式定义 Docker 卷 db-data
