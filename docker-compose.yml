# 用途：本地开发/本地机器构建镜像并启动（会执行 build）
# 适用场景：本机或可正常访问 DockerHub 的环境
# 启动命令（在 vue3-koa2-server 目录执行）：docker compose --project-name my_project up -d --build
services:
  mongo:
    image: mongo:latest
    container_name: vue3-koa2-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vue3-koa2-server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/imooc-manager
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
    ports:
      - "3000:3000"

  web:
    build:
      context: ../vue3-koa2-web
      dockerfile: Dockerfile
    container_name: vue3-koa2-web
    restart: unless-stopped
    depends_on:
      - webserver
    ports:
      - "8080:80"

volumes:
  mongo-data:
